# Isaac-only DELTAS on top of mir_description/config/diffdrive_controller.yaml.
#
# mir_isaac.launch.py hands ros2_control_node both files, in that order, so
# whatever is set here wins and everything else -- wheel geometry, the MiR100
# speed limits, the arm/gripper controllers -- comes from the one shared file.
#
# This used to be a full copy of that file, and it drifted: the MiR100 spec
# alignment (1.5 m/s forwards, 0.3 m/s backwards, commit 0b60aed) reached only
# the Gazebo copy, leaving Isaac at 1.0 m/s forwards and an unlimited -1.0 m/s
# reverse. Keep this file to the deltas only.
diff_cont:
  ros__parameters:
    # The Isaac bridge broadcasts odom->base_footprint itself (mir_isaac_sim.py
    # publishes it by default; --no-publish-odom turns it off). Two broadcasters
    # of the same transform fight and the robot pose jumps, so the controller
    # must not also publish it. Gazebo has no other odom source, which is why the
    # shared file has this true.
    enable_odom_tf: false
